name: Release

# Builds prebuilt binaries for a release and attaches them to it. Runs when a
# release is published, or by hand for an existing release tag. Binaries are
# always built from the tag's source; the build script comes from this
# workflow's own commit, so older tags can be built too.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build binaries for (for example v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the release exists
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Check out the build tooling
        uses: actions/checkout@v4
        with:
          path: tooling

      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: src

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: src/go.sum

      - name: Build
        working-directory: src
        run: ../tooling/scripts/build-release.sh "$TAG" ../dist

      - name: Upload to the release
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
